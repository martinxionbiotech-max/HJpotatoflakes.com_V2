# ============================================================
# mkdocs.yml — Hongji Agriculture Technical Documentation Center
# Site:  https://docs.hjpotatoflakes.com
# Stack: MkDocs 1.6.1 + Material
# ============================================================

# ---------- 站点基本信息（修复 meta description 泄漏 + canonical）----------
site_name: Hongji Agriculture Technical Documentation
site_description: >-
  Technical documentation for HONGJI Agriculture — potato flakes and potato
  powder specifications, processing technology, quality control, and application
  guides for B2B food manufacturers and importers.
site_url: https://docs.hjpotatoflakes.com/
site_author: Hongji Agriculture Technology Co., Ltd.
copyright: © 2026 Hongji Agriculture Technology Co., Ltd. (弘基农业)

# ---------- 仓库（CI 部署时启用，可选）----------
# repo_url: https://github.com/<org>/docs.hjpotatoflakes.com
# edit_uri: edit/main/docs/

# ---------- 主题 ----------
theme:
  name: material
  custom_dir: overrides            # 用于注入 JSON-LD（见 overrides/main.html）
  language: en
  icon:
    logo: material/sprout
    repo: fontawesome/brands/github
  features:
    - navigation.tabs             # 顶部标签
    - navigation.sections         # 侧边栏分区
    - navigation.indexes          # domain 目录 index 页作为分区入口
    - navigation.top              # 返回顶部
    - navigation.footer           # 上一篇/下一篇
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

