# ---------- 插件 ----------
plugins:
  - search
  - meta            # 允许每页 frontmatter 覆盖 description/title

# ---------- Markdown 扩展（技术文档必备）----------
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - footnotes
  - def_list
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  # 如需 emoji/图标，启用下面两行（MkDocs 运行时支持 !!python/name 语法）
  # - pymdownx.emoji:
  #     emoji_index: !!python/name:material.extensions.emoji.twemoji
  #     emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

# ---------- 站点扩展信息 ----------
extra:
  generator: false                 # 隐藏 "Made with Material for MkDocs"（可选）
  social:
    # 按需填写实际社交账号（主站 footer 同源）
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/hongji-agriculture/
    - icon: fontawesome/brands/facebook
      link: https://www.facebook.com/hongjiagriculture/
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@hongjiagriculture/
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation.
    # Material 内置 cookie 同意横幅，与主站 Cookie Policy 呼应

# ============================================================
# 说明：
# 1. canonical —— 设置 site_url 后 Material 自动为每页生成 <link rel="canonical">。
# 2. JSON-LD Schema（Organization / WebSite / BreadcrumbList / TechArticle）——
#    MkDocs 不内置，需通过 theme.custom_dir: overrides + overrides/main.html 注入。
#    overrides/main.html 需继承 material 的 base 模板并在 head 里加入 JSON-LD 块。
# 3. robots.txt —— 直接放 docs/robots.txt（MkDocs 会原样复制到 site/）。
# ============================================================
